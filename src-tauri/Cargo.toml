[package]
name = "sixunited-systeminfo"
version = "2.1.1"
edition = "2024"
rust-version = "1.92"
authors = ["sclliang"]
description = "Windows hardware information and event log collection"
publish = false

[package.metadata.tauri-winres]
Author = "sclliang"
CompanyName = "sixunited"
LegalCopyright = "Copyright (c) 2026 sixunited. Author: sclliang"
OriginalFilename = "SystemInfo.exe"
InternalName = "SystemInfo"

[[bin]]
name = "SystemInfo"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
serde_json = "1"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
