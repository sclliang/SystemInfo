<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SystemInfo · 电脑信息</title>
  <link rel="icon" href="six.ico">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2.4"/><path d="M12 17v3m-4 0h8"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 .1 6M20 4v5h-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="7" width="12" height="14" rx="2.5"/><path d="M15 4.5V4a1 1 0 0 0-1-1H6a2 2 0 0 0-2 2v12"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4m-9 3h6m-6 4h6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v3H6l-3 9zm0 12 3-9h16l-3 9z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 18 6M8 6h10v10"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 12 12"><path d="M1 6.5h10"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx=".4"/></symbol>
    <symbol id="i-restore" viewBox="0 0 12 12"><path d="M3.5 2.5v-1h7v7h-1"/><rect x="1.5" y="3.5" width="7" height="7" rx=".3"/></symbol>
    <symbol id="i-close" viewBox="0 0 12 12"><path d="m1.5 1.5 9 9m0-9-9 9"/></symbol>
  </svg>
  <header class="titlebar">
    <div class="caption" data-tauri-drag-region="deep"><img src="six.ico" alt="" width="16" height="16" draggable="false"><span>SystemInfo</span></div>
    <div class="window-controls">
      <button id="win-min" aria-label="最小化" title="最小化"><svg aria-hidden="true"><use href="#i-minimize"/></svg></button>
      <button id="win-max" aria-label="最大化" title="最大化"><svg aria-hidden="true"><use id="win-max-glyph" href="#i-maximize"/></svg></button>
      <button id="win-close" aria-label="关闭" title="关闭"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <main class="viewport"><div class="shell">
    <section class="intro" aria-label="设备概览">
      <div class="intro-identity">
        <img class="device-art" src="icons/workstation.svg" alt="" width="108" height="82">
        <div><h1>电脑信息</h1><div class="readout">
          <span class="machine"><svg aria-hidden="true"><use href="#i-pc"/></svg><b id="machine-name">本机</b></span>
          <span class="state" id="state" data-state="busy" role="status"><i></i><span id="status-text">正在读取硬件信息</span></span>
          <span class="updated" id="updated" hidden><time id="time"></time> 更新</span>
        </div></div>
      </div>
      <div class="actions">
        <button id="refresh" title="刷新电脑信息（F5）" disabled><svg><use href="#i-refresh"/></svg>刷新</button>
        <button id="copy" disabled><svg><use href="#i-copy"/></svg>复制全部</button>
        <button id="collect" class="primary" disabled><svg><use href="#i-log"/></svg><span>收集日志</span></button>
      </div>
    </section>
    <section id="log-panel" class="log-panel" aria-label="日志收集" hidden>
      <div class="log-line"><div class="log-heading"><svg><use href="#i-log"/></svg><strong id="log-title"></strong></div>
        <div class="log-actions">
          <button id="cancel" class="small" hidden>取消收集</button>
          <button id="open-report" class="small" hidden>打开报告<svg><use href="#i-arrow"/></svg></button>
          <button id="open-folder" class="small" hidden><svg><use href="#i-folder"/></svg>打开目录</button>
        </div>
      </div>
      <progress id="log-progress" aria-label="日志收集进度"></progress>
      <p id="log-detail" hidden></p><p id="log-path" hidden></p>
    </section>
    <div class="sheet">
      <div class="sheet-column" id="main-column"></div>
      <div class="sheet-column side" id="side-column"></div>
    </div>
    <aside id="diagnostics" hidden><h2>采集提示</h2><p id="diagnostic-text"></p></aside>
  </div></main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
